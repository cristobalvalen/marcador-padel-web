<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<title>Marcador Pádel</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #111; --gold: #f5c542; --dim: #8a8a8a; --text: #f4f4f4; --ball: #d4e157; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { display: flex; align-items: center; gap: 2.4vmin; padding: 1.2vmin 3vmin; font-size: 3.6vmin; color: var(--dim); }
  #mode { font-weight: 600; color: var(--text); }
  #history { white-space: nowrap; }
  #status { flex: 1; text-align: center; color: var(--gold); font-weight: 600; }
  #conn { display: flex; align-items: center; gap: 1vmin; font-size: 3vmin; }
  #conn i { width: 2.2vmin; height: 2.2vmin; border-radius: 50%; background: #c62828; display: inline-block; }
  #conn.ok i { background: #43a047; }
  #conn.wait i { background: #f9a825; }
  header button { background: none; border: 1px solid #444; color: var(--dim); border-radius: 1vmin; font-size: 3vmin; padding: .6vmin 1.6vmin; }

  /* Izquierda: el equipo que saca. Derecha: el que resta. */
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.6vmin;
    padding: 0 2vmin 2vmin; min-height: 0; }
  .half { display: flex; flex-direction: column; justify-content: space-between; min-height: 0;
    border-radius: 3vmin; padding: 1.4vmin 2.4vmin 1.6vmin; border: .8vmin solid transparent;
    background: var(--bgc); color: var(--c); }
  .half.us { --c: #8fe0a4; --bgc: #16331f; --vivid: #43c463; --line: #2c5a3a; }
  .half.them { --c: #f4a8a8; --bgc: #3a1a1a; --vivid: #e53935; --line: #6a3030; }
  .half.serving { border-color: var(--vivid); }
  .half.won { background: var(--vivid); color: #fff; --line: rgba(255,255,255,.4); }

  .top { display: flex; align-items: center; gap: 1.2vmin; font-size: 3.6vmin; font-weight: 600; min-height: 4.6vmin; }
  .ball { width: 3.6vmin; height: 3.6vmin; border-radius: 50%; background: var(--ball); visibility: hidden; flex: none; }
  .half.serving .ball { visibility: visible; }
  .role { color: var(--dim); font-weight: 400; }
  .half.serving .role { color: var(--ball); font-weight: 600; }

  .points { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;
    font-size: min(48vh, 27vw); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .points.word { font-size: min(14vh, 9vw); text-align: center; }

  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 2vmin;
    border-top: .3vmin solid var(--line); padding-top: 1.2vmin; font-size: 3.4vmin; }
  .bottom.off { display: none; }
  .games { font-size: 10vmin; line-height: 1; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 1vmin; align-items: center; }
  .pip { width: 3.4vmin; height: 3.4vmin; border-radius: 50%; border: .5vmin solid var(--c); }
  .pip.on { background: var(--c); }

  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.72); font-size: 7vmin; font-weight: 700; text-align: center; padding: 5vmin; }
  #overlay.show { display: flex; }
  #overlay small { display: block; font-size: 3.6vmin; font-weight: 400; color: var(--dim); margin-top: 2vmin; }

  /* Solo en horizontal: en vertical se pide girar el movil */
  #turn { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--bg); font-size: 7vmin; font-weight: 700; text-align: center; padding: 8vmin; }
  @media (orientation: portrait) {
    #turn { display: flex; }
  }
</style>
</head>
<body>
<header>
  <span id="mode">Marcador Pádel</span>
  <span id="history"></span>
  <span id="status"></span>
  <span id="conn" class="wait"><i></i><span id="connText">Conectando…</span></span>
  <button id="fs" type="button" title="Pantalla completa">⛶</button>
</header>
<main>
  <section class="half us" id="hl">
    <div class="top"><span class="ball"></span><span class="role"></span></div>
    <div class="points">0</div>
    <div class="bottom"><span class="games"></span><span class="pips"></span></div>
  </section>
  <section class="half them" id="hr">
    <div class="top"><span class="ball"></span><span class="role"></span></div>
    <div class="points">0</div>
    <div class="bottom"><span class="games"></span><span class="pips"></span></div>
  </section>
</main>
<div id="overlay"></div>
<div id="turn">Pon el móvil en horizontal</div>

<script>
'use strict'

// ---------------------------------------------------------------- canal
// Mismo canal que lib/feed.js en el reloj. La pagina se publica en un repositorio
// publico, asi que el nombre del canal no va dentro: se pasa una vez por la URL
//   ?t=<topic>   ntfy.sh
//   ?db=<url>    Firebase Realtime Database (la ruta, sin ".json")
//   ?demo=1      partido de mentira, para ver el marcador sin el reloj
// y la pagina lo recuerda.
const params = new URLSearchParams(location.search)

const $ = (id) => document.getElementById(id)
const halves = [$('hl'), $('hr')] // izquierda (saca) y derecha (resta)

let current = null // ultima vista pintada
let leftTeam = 0 // equipo que ocupa la mitad izquierda (0 = nosotros, 1 = ellos)

// --------------------------------------------------------------- pintar
const MODE_NAMES = { normal: 'Partido', americana: 'Americana', tiebreak: 'Tie-break', puntos: 'Puntos' }
const SETS_TO_WIN = 2

const showOverlay = (html) => {
  const o = $('overlay')
  o.innerHTML = html || ''
  o.classList.toggle('show', !!html)
}

// Que equipo va a la izquierda. Con el saque cambiando por juegos, el que saca
// va a la izquierda y las mitades se intercambian cuando cambia. En el tie-break
// y en el modo Puntos el saque cambia cada 2 puntos: ahi las mitades se quedan
// como estaban al empezar (0-0) para que no salten.
const placeTeams = (m) => {
  if (m.serverTeam === null) return
  const frozen = m.tiebreak || m.mode === 'puntos' || m.mode === 'tiebreak'
  if (!frozen) leftTeam = m.serverTeam
  else if (m.points[0] === '0' && m.points[1] === '0') leftTeam = m.serverTeam
}

const paintHalf = (el, team, m) => {
  const serving = m.winner === null && m.serverTeam === team
  const won = m.winner === team
  el.className = 'half ' + (team === 0 ? 'us' : 'them') + (serving ? ' serving' : '') + (won ? ' won' : '')
  el.querySelector('.role').textContent = m.winner !== null || m.serverTeam === null ? '' : serving ? 'saca' : 'resta'

  const points = el.querySelector('.points')
  if (m.winner !== null) {
    points.className = 'points word'
    // Lo ven los dos equipos: nada de "ganamos", solo quien gano, por color
    points.textContent = won ? 'Ganador' : ''
  } else {
    points.className = 'points'
    points.textContent = m.points[team]
  }

  const bottom = el.querySelector('.bottom')
  const showSets = m.mode === 'normal'
  const showGames = m.mode === 'normal' || m.mode === 'americana'
  bottom.classList.toggle('off', !showGames)
  el.querySelector('.games').textContent = showGames ? m.games[team] : ''
  const pips = el.querySelector('.pips')
  pips.innerHTML = ''
  if (showSets) for (let i = 0; i < SETS_TO_WIN; i++) {
    const pip = document.createElement('span')
    pip.className = 'pip' + (i < m.setsWon[team] ? ' on' : '')
    pips.appendChild(pip)
  }
}

const render = (view) => {
  const m = view && view.match
  if (!m) {
    $('mode').textContent = 'Marcador Pádel'
    $('history').textContent = ''
    $('status').textContent = ''
    halves.forEach((el, i) => {
      el.className = 'half ' + (i === 0 ? 'us' : 'them')
      el.querySelector('.role').textContent = ''
      el.querySelector('.points').textContent = '0'
      el.querySelector('.points').className = 'points'
      el.querySelector('.bottom').classList.add('off')
    })
    showOverlay('Esperando al reloj…<small>Abre un partido en el reloj</small>')
    return
  }

  placeTeams(m)
  paintHalf(halves[0], leftTeam, m)
  paintHalf(halves[1], 1 - leftTeam, m)

  $('mode').textContent = MODE_NAMES[m.mode] || m.mode
  $('history').textContent = m.mode === 'normal'
    ? m.sets.map((s, i) => (i + 1) + '.º ' + s[0] + '-' + s[1]).join(' · ')
    : ''
  let status = ''
  if (m.winner !== null) status = 'Partido terminado'
  else if (m.pending === 'server1') status = 'Eligiendo quién saca'
  else if (m.pending === 'server2') status = 'Eligiendo quién saca ahora'
  else if (m.pending === 'deuce') status = '40-40: ¿punto de oro o ventajas?'
  else if (m.superTb) status = 'Super tie-break'
  else if (m.tiebreak && m.mode === 'normal') status = 'Tie-break'
  else if (m.deuceRule === 'golden' && m.points[0] === '40' && m.points[1] === '40') status = 'Punto de oro'
  $('status').textContent = status

  showOverlay(view.live || m.winner !== null ? '' : 'Partido en pausa<small>El reloj está en el menú</small>')
}

// Solo se pinta si es mas nuevo que lo que hay (los mensajes pueden llegar
// repetidos o desordenados al reconectar).
const accept = (view) => {
  if (!view || typeof view.at !== 'number') return
  if (current && view.at <= current.at) return
  current = view
  render(view)
}

const setConn = (state, text) => {
  $('conn').className = state
  $('connText').textContent = text
}

// ---------------------------------------------------------------- canales
const listenNtfy = (topic) => {
  // since=12h: al conectar (y al reconectar) llegan los mensajes recientes,
  // y accept() se queda con el mas nuevo, asi que no hace falta pedirlo aparte.
  const es = new EventSource('https://ntfy.sh/' + encodeURIComponent(topic) + '/sse?since=12h')
  es.onopen = () => setConn('ok', 'En directo')
  es.onerror = () => setConn('wait', 'Reconectando…')
  es.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data)
      if (msg.event === 'message') accept(JSON.parse(msg.message))
    } catch (err) { console.warn('mensaje no valido', err) }
  }
}

const listenFirebase = (db) => {
  const url = db.replace(/\/+$/, '') + '.json'
  const reload = () => fetch(url).then((r) => r.json()).then(accept).catch((e) => console.warn(e))
  const es = new EventSource(url)
  es.onopen = () => setConn('ok', 'En directo')
  es.onerror = () => setConn('wait', 'Reconectando…')
  es.addEventListener('put', (e) => {
    const { path, data } = JSON.parse(e.data)
    if (path === '/') accept(data)
    else reload()
  })
  es.addEventListener('patch', reload)
}

// Partido de mentira: suma puntos al azar para ver el marcador sin el reloj
const runDemo = () => {
  setConn('ok', 'Demo')
  const labels = ['0', '15', '30', '40']
  let p = [0, 0], g = [3, 2], sets = [[6, 4]], at = 1, server = 2
  const tick = () => {
    const t = Math.random() < 0.5 ? 0 : 1
    p[t]++
    if (p[t] >= 4) { p = [0, 0]; g[t]++; server = (server + 1) % 4 }
    if (g[t] >= 6 && g[t] - g[1 - t] >= 2) { sets.push(g.slice()); g = [0, 0] }
    const won = [0, 0]; sets.forEach((s) => won[s[0] > s[1] ? 0 : 1]++)
    accept({ v: 1, at: at++, live: true, match: {
      mode: 'normal', points: [labels[Math.min(p[0], 3)], labels[Math.min(p[1], 3)]],
      games: g.slice(), sets: sets.map((s) => s.slice()), setsWon: won, tiebreak: false,
      superTb: false, deuceRule: 'golden', server, serverTeam: server >> 1, firstServer: 2,
      pending: null, winner: won[0] >= 2 ? 0 : won[1] >= 2 ? 1 : null } })
    if (won[0] < 2 && won[1] < 2) setTimeout(tick, 1500)
  }
  tick()
}

// El canal elegido por la URL se recuerda: el acceso de la pantalla de
// inicio abre la pagina sin parametros.
const FEED_KEY = 'padel_feed'
const feedFromUrl = params.get('db') ? { db: params.get('db') } : params.get('t') ? { t: params.get('t') } : null
if (feedFromUrl) localStorage.setItem(FEED_KEY, JSON.stringify(feedFromUrl))
let feed = feedFromUrl
if (!feed) {
  try { feed = JSON.parse(localStorage.getItem(FEED_KEY)) } catch (e) { feed = null }
}

render(null)
if (params.get('demo')) runDemo()
else if (feed && feed.db) listenFirebase(feed.db)
else if (feed && feed.t) listenNtfy(feed.t)
else {
  setConn('', 'Sin canal')
  showOverlay('Falta el canal<small>Abre la página con ?t=nombre-del-canal (solo la primera vez)</small>')
}

// ------------------------------------------- pantalla siempre encendida
let lock = null
const keepAwake = async () => {
  if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || lock) return
  try {
    lock = await navigator.wakeLock.request('screen')
    lock.addEventListener('release', () => { lock = null })
  } catch (e) { console.warn('wake lock', e) }
}
document.addEventListener('visibilitychange', keepAwake)
document.addEventListener('click', keepAwake)
keepAwake()

// Pantalla completa; en Android ademas se fija en horizontal
$('fs').addEventListener('click', () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return }
  document.documentElement.requestFullscreen()
    .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
    .catch(() => {})
})
</script>
</body>
</html>
